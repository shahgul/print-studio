name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec prettier --write packages/domain/src/index.ts packages/domain/src/media.ts packages/domain/src/sheet-definition.ts
      - run: git diff -- packages/domain/src/index.ts packages/domain/src/media.ts packages/domain/src/sheet-definition.ts && exit 1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
