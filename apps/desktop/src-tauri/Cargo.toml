[package]
name = "print-studio"
version = "0.0.0"
description = "Print Studio desktop shell"
authors = ["Print Studio"]
edition = "2021"

[lib]
name = "print_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
notify = "8"
